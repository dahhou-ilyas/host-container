services:
  docker-proxy:
    container_name: docker-proxy
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - EXEC=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - go-network
    restart: unless-stopped

  api:
    container_name: go-api
    build:
      context: .
      dockerfile: Dockerfile
    image: go-api:latest
    ports:
      - "8080:8080"
      - "2112:2112"
    volumes:
      - /tmp/projects:/tmp/projects
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - PROJECTS_BASE_PATH=/tmp/projects
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
      - APP_ADDR=:8080
      - ADMIN_ADDR=:2112
      - ENABLE_PPROF=${ENABLE_PPROF:-false}
      - DOCKER_HOST=tcp://docker-proxy:2375
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
    networks:
      - go-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
      tempo:
        condition: service_started

  postgres:
    container_name: go-postgres
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-docker_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-docker_user}
      - POSTGRES_DB=${POSTGRES_DB:-docker_wrapper}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - go-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docker_user} -d ${POSTGRES_DB:-docker_wrapper}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.55.0
    volumes:
      - ./Docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - go-network
    restart: unless-stopped

  tempo:
    container_name: tempo
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./Docker/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "4318:4318"   # OTLP HTTP (traces de l'API)
      - "3200:3200"   # HTTP query (Grafana datasource)
    networks:
      - go-network
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:11.3.0
    volumes:
      - ./Docker/grafana.yml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - go-network
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    restart: unless-stopped

volumes:
  postgres-data:
  grafana-data:
  tempo-data:

networks:
  go-network:
    driver: bridge
